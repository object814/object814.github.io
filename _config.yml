# Site settings
title       : "Haoyu Zhou"
description : "DPhil student in Robotics at the University of Oxford. Robot learning, world models, continual learning."
repository  : "object814/object814.github.io"

# Author / profile (rendered in the masthead of _layouts/home.html)
author:
  name          : "Haoyu Zhou"
  name_native   : "周淏宇"
  avatar        : "images/profile_img.jpg"
  position      : "DPhil Student, Robotics"
  affiliation   : "Applied AI Lab, University of Oxford"
  affiliation_url: "https://ori.ox.ac.uk/groups/a2i"
  location      : "Oxford, United Kingdom"
  focus         : "Robot learning · Continual world models"
  email         : "haoyu@robots.ox.ac.uk"
  email_display : "haoyu at robots.ox.ac.uk"
  googlescholar : "https://scholar.google.com/citations?user=WFkhn04AAAAJ&hl=en"
  github        : "object814"

# Visitor map (mapmyvisitors.com). Leave blank to hide.
mapmyvisitors_id: "NtcICbaT1M7PhxB3g6hsiegL8P0dth_Z8TcHHArKylo"

# Reading files
include:
  - _pages
exclude:
  - docs
  - google_scholar_crawler
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - run_server.sh
  - vendor

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope: { path: "", type: pages }
    values: { layout: home }

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
